<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>От дивана до фермерского отеля — прототип</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#2b2520;color:#f3e9d6;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:980px;margin:0 auto;padding:12px}
header{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:8px}
h1{font-size:17px;margin:0;flex:1 1 220px;color:#ffd98a}
.stat{background:#3a322b;border:1px solid #57493c;border-radius:6px;padding:4px 10px;white-space:nowrap}
.stat b{color:#ffd35a}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid #7a6650;background:#4a3f35;color:#f3e9d6;padding:6px 12px}
button:hover{background:#5a4d40}
button.pri{background:#d9892b;border-color:#f0a64a;color:#231a10;font-weight:600}
button.pri:hover{background:#eb9a3a}
button:disabled{opacity:.45;cursor:default}
#goal{background:#3a322b;border-left:4px solid #d9892b;border-radius:4px;padding:8px 12px;margin-bottom:8px}
#goal small{display:block;color:#bfae93}
#stage{position:relative;border:2px solid #57493c;border-radius:6px;overflow:hidden;background:#1d2a1c;touch-action:manipulation}
canvas{display:block;width:100%;aspect-ratio:480/300;image-rendering:pixelated;cursor:pointer}
#labels{position:absolute;inset:0;pointer-events:none}
.lab{position:absolute;transform:translate(-50%,-100%);background:rgba(35,26,16,.88);color:#ffe9b0;border:1px solid #d9892b;border-radius:4px;padding:1px 7px;font-size:12px;white-space:nowrap}
#fade{position:absolute;inset:0;background:#05060f;opacity:0;pointer-events:none;transition:opacity .6s}
#fade.on{opacity:1}
#morningBtn{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-size:16px;padding:9px 18px}
#toast{position:absolute;left:8px;right:8px;top:8px;text-align:center;pointer-events:none}
#toast span{display:inline-block;background:rgba(35,26,16,.92);border:1px solid #7a6650;border-radius:6px;padding:5px 12px}
#rooms{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.room{flex:1 1 220px;background:#3a322b;border:1px solid #57493c;border-radius:6px;padding:8px 12px}
.room h3{margin:0 0 2px;font-size:14px;color:#ffd98a}
.room.off{opacity:.6;border-style:dashed}
details{margin-top:8px;background:#3a322b;border:1px solid #57493c;border-radius:6px;padding:6px 12px}
summary{cursor:pointer;color:#ffd98a}
table{border-collapse:collapse;width:100%;margin-top:6px}
td,th{padding:3px 6px;border-bottom:1px solid #4e4236;text-align:left}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
#modal{position:fixed;inset:0;background:rgba(10,8,6,.66);display:flex;align-items:center;justify-content:center;padding:14px;z-index:5}
#modal[hidden]{display:none}
#box{background:#f3e6c8;color:#33271a;border-radius:8px;border:3px solid #a9793f;max-width:440px;width:100%;padding:16px 18px}
#box h2{margin:0 0 8px;font-size:18px}
#box td,#box th{border-color:#d6c39a}
#box textarea{width:100%;font:inherit;padding:8px;border:1px solid #a9793f;border-radius:4px;background:#fffaf0;resize:none}
#box .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
#box button{background:#e7d5ad;color:#33271a;border-color:#a9793f}
#box button.pri{background:#d9892b}
.hint{color:#bfae93;font-size:13px;margin-top:8px}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>От дивана до фермерского отеля</h1>
    <span class="stat" id="time"></span>
    <span class="stat">Монеты: <b id="coins">0</b></span>
    <button id="newBtn">Новая игра</button>
  </header>
  <div id="goal"></div>
  <div id="stage">
    <canvas id="cv" width="480" height="300"></canvas>
    <div id="labels"></div>
    <div id="toast"></div>
    <button id="morningBtn" class="pri" hidden>Перейти к утру</button>
    <div id="fade"></div>
  </div>
  <div id="rooms"></div>
  <details><summary>Баланс</summary><table id="ledger"></table></details>
  <div class="hint">Клик по земле — идти. Клик по объекту с меткой — действие. Прогресс сохраняется в этом браузере.</div>
</div>
<div id="modal" hidden><div id="box"></div></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const cv=$('cv'),g=cv.getContext('2d'),W=480,H=300;
g.imageSmoothingEnabled=false;

// ---------- сцены ----------
const SC={
  out:{tw:32,th:16,ox:230,oy:70,gw:14,gh:12,minx:.3,maxx:13.7,miny:6.3,maxy:11.7,speed:3.4},
  home:{tw:48,th:24,ox:228,oy:108,gw:7,gh:6,minx:.4,maxx:6.6,miny:1.3,maxy:5.7,speed:2.8},
  annex:{tw:48,th:24,ox:240,oy:134,gw:4,gh:4,minx:.4,maxx:3.6,miny:1.1,maxy:3.7,speed:2.8}
};
let sc=SC.out;
const HS={
  board:{scene:'out',x:3,y:8,z:26,ax:3.3,ay:8.7},
  hdoor:{scene:'out',x:6.5,y:6,z:30,ax:6.5,ay:6.4},
  adoor:{scene:'out',x:11.25,y:6,z:30,ax:11.25,ay:6.4},
  guests:{scene:'out',x:7.9,y:6.9,z:24,ax:7,ay:7.4},
  stove:{scene:'home',x:1.5,y:.6,z:46,ax:1.5,ay:1.5},
  table:{scene:'home',x:3.25,y:3.1,z:34,ax:3.25,ay:4.1},
  hbed:{scene:'home',x:5.85,y:1,z:40,ax:5.85,ay:2.4},
  hmat:{scene:'home',x:3.5,y:5.6,z:10,ax:3.5,ay:5.55},
  abed:{scene:'annex',x:.8,y:1.3,z:36,ax:1.7,ay:1.6},
  astand:{scene:'annex',x:3.1,y:.5,z:40,ax:3.1,ay:1.2},
  amat:{scene:'annex',x:2,y:3.6,z:10,ax:2,ay:3.55}
};
const SEATS=[{x:2.15,y:3.1},{x:4.35,y:3.1},{x:3.25,y:2.3}];
const PLATES=[{x:2.8,y:3.1},{x:3.7,y:3.1},{x:3.25,y:2.85}];
const COL=['#c2553f','#4f8f8a','#8a6fb0'],HAIR=['#5a3a22','#d9b45a','#2e2a2a'];
const PRICE={bed:30,annex:50};

// ---------- состояние ----------
const KEY='farm-hotel-proto-v1';
function fresh(){return{
  coins:0,day:1,phase:'ad',adText:'Сдам место на ночь. Ужин включён',posted:false,
  cooked:false,served:false,dishes:false,plates:[],
  rooms:{home:{built:true,cap:1,rate:30,bed:'ready'},annex:{built:false,cap:1,rate:30,bed:'ready'}},
  bookings:[],won:false,scene:'out',ledger:[{t:'Начало игры',d:0,b:0}]
};}
let S;
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.phase&&s.rooms)return s;}catch(e){}return null;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}hud();}

let player,ents=[],eatT=0;
const gn=()=>S.bookings.reduce((a,b)=>a+b.n,0);
const roomName=r=>r==='home'?'номер в доме':'пристройка';

function go(scene,x,y){player.scene=S.scene=scene;sc=SC[scene];player.x=x;player.y=y;player.path=[];player.then=null;save();}
function start(s){
  S=s||fresh();
  player={scene:S.scene,x:0,y:0,path:[],then:null,busy:null,walk:0,col:'#3f6fb0',hair:'#7a4a22'};
  sc=SC[S.scene];
  const sp={out:[6.5,7.2],home:[3.5,5.2],annex:[2,3.2]}[S.scene];player.x=sp[0];player.y=sp[1];
  eatT=1;placeGuests();save();
}
function mkEnt(b,i){const k=b.room==='annex'?2:i;return{b:b.id,k,scene:'out',x:0,y:0,path:[],walk:0,lying:false,col:COL[k],hair:HAIR[k]};}
function placeGuests(){
  ents=[];
  for(const b of S.bookings)for(let i=0;i<b.n;i++){
    const e=mkEnt(b,i),k=e.k,dx=7.4+k*.7;
    if(b.stage==='coming'){e.x=16+k*.9;e.y=9.7;e.path=[{x:dx,y:9.7},{x:dx,y:6.9}];}
    else if(b.stage==='door'){e.x=dx;e.y=6.9;}
    else if(b.stage==='table'){e.scene='home';e.x=SEATS[k].x;e.y=SEATS[k].y;}
    else if(b.stage==='sleep'){e.scene=b.room;e.lying=true;}
    else continue;
    ents.push(e);
  }
}

// ---------- логика ----------
function makeBookings(){
  S.bookings=[{id:'home',room:'home',n:S.rooms.home.cap,stage:'coming',paid:false}];
  if(S.rooms.annex.built)S.bookings.push({id:'annex',room:'annex',n:1,stage:'coming',paid:false});
  S.cooked=S.served=false;S.posted=true;S.phase='arrive';
  placeGuests();
}
function adAct(){
  if(S.day===1&&!S.posted){
    modal('<h2>Объявление</h2><p>Что написать на листке у дороги?</p><textarea id="adT" rows="3" maxlength="90"></textarea>',
      [{t:'Отмена'},{t:'Расклеить',pri:1,fn:()=>{S.adText=($('adT').value.trim()||fresh().adText);postAd();}}]);
    $('adT').value=S.adText;
  }else postAd();
}
function postAd(){
  makeBookings();
  toast('Объявление висит у дороги. Есть отклик: '+who()+' уже в пути.');save();
}
const who=()=>S.bookings.map(b=>b.n===2?'пара':'гость').join(' и ');
function checkin(){
  for(const b of S.bookings)b.stage='table';
  for(const e of ents)e.path=[{x:6.5,y:6.4},{warp:'home',x:3.5,y:5.3},SEATS[e.k]];
  S.phase='dinner';
  toast('Заселены: '+S.bookings.map(b=>(b.n===2?'пара':'гость')+' — '+roomName(b.room)).join(', ')+'. Теперь ужин.');save();
}
function busy(d,k,cb){player.busy={t:0,d,k,cb};}
function cook(){busy(2,'cook',()=>{S.cooked=true;toast('Ужин готов, порций: '+gn()+'. Продукты на сегодня закончились.');save();});}
function serve(){S.served=true;S.plates=ents.filter(e=>e.scene==='home').map(e=>e.k);eatT=3;save();}
function makeBed(b){busy(1.2,'bed',()=>{
  S.rooms[b.room].bed='made';b.stage='sleep';
  for(const e of ents)if(e.b===b.id)e.path=b.room==='home'
    ?[{x:5.85,y:2.4},{lie:1}]
    :[{x:3.5,y:5.5},{warp:'out',x:6.5,y:6.4},{x:11.25,y:6.4},{warp:'annex',x:2,y:3.3},{x:1.7,y:1.6},{lie:1}];
  if(S.bookings.every(x=>x.stage==='sleep'))S.phase='night';
  save();
});}
function toMorning(){
  $('morningBtn').hidden=true;$('fade').classList.add('on');
  setTimeout(()=>{
    ents=[];
    for(const b of S.bookings){
      b.stage='left';S.rooms[b.room].bed='used';
      const dx=b.room==='home'?6.5:11.25;
      for(let i=0;i<b.n;i++){const e=mkEnt(b,i);e.x=dx+i*.6;e.y=6.6;e.path=[{x:dx+i*.6,y:9.7},{x:-1.5,y:9.7},{gone:1}];ents.push(e);}
    }
    S.phase='morning';save();$('fade').classList.remove('on');
    toast('Утро. Гости уезжают и оставляют плату.');
  },700);
}
function collect(b){
  const r=S.rooms[b.room],sum=r.rate;
  b.paid=true;S.coins+=sum;
  S.ledger.push({t:'Утро после ночи '+S.day+': '+(b.n===2?'пара':'гость')+', '+roomName(b.room),d:sum,b:S.coins});
  save();
  modal('<h2>Счёт: '+roomName(b.room)+'</h2><table>'+
    '<tr><td>Проживание, 1 ночь, '+(b.n===2?'пара (2 гостя)':'1 гость')+'</td><td class="n">'+sum+'</td></tr>'+
    '<tr><td>Ужин на '+b.n+'</td><td class="n">включён</td></tr>'+
    '<tr><th>Получено</th><th class="n">'+sum+' монет</th></tr></table>',[{t:'Забрать',pri:1,fn:check}]);
}
function washUp(){busy(1,'clean',()=>{S.dishes=false;S.plates=[];check();});}
function strip(r){busy(1,'clean',()=>{S.rooms[r].bed='bare';check();});}
function prep(r){busy(1,'clean',()=>{S.rooms[r].bed='ready';check();});}
function check(){
  const R=S.rooms;
  if(S.phase==='morning'&&S.bookings.every(b=>b.paid)&&!S.dishes&&R.home.bed==='ready'&&R.annex.bed==='ready'){
    S.day++;S.bookings=[];S.posted=false;
    if(R.home.cap===1||!R.annex.built){S.phase='build';save();openBuild();return;}
    S.phase='ad';toast('Уборка закончена. Номера готовы — можно звать новых гостей.');
  }
  save();
}
function openBuild(){
  const R=S.rooms,bedUp=R.home.cap===1,price=bedUp?PRICE.bed:PRICE.annex,ok=S.coins>=price;
  const rows=bedUp
    ?[['Спальных мест в номере','1 → 2'],['Кого можно принять','одного гостя → пару'],['Тариф за ночь','30 → 50']]
    :[['Номеров','1 → 2'],['Вместимость отеля','2 → 3 человека'],['Тариф пристройки','30 за ночь'],['Выручка за полную ночь','50 → 80']];
  modal('<h2>'+(bedUp?'Второе спальное место':'Одноместная пристройка')+'</h2><p>'+
    (bedUp?'Уборка закончена. Диван можно заменить двумя кроватями.':'Рядом с домом есть земля под ещё один номер.')+'</p><table>'+
    rows.map(r=>'<tr><td>'+r[0]+'</td><td class="n">'+r[1]+'</td></tr>').join('')+
    '<tr><th>Стоимость</th><th class="n">'+price+' монет</th></tr><tr><td>В кошельке</td><td class="n">'+S.coins+'</td></tr></table>',
    [{t:'Позже'},{t:'Купить за '+price,pri:1,off:!ok,fn:()=>buy(bedUp,price)}]);
}
function buy(bedUp,price){
  const R=S.rooms;S.coins-=price;
  if(bedUp){R.home.cap=2;R.home.rate=50;S.ledger.push({t:'Переделка номера в двухместный',d:-price,b:S.coins});}
  else{R.annex.built=true;S.won=true;S.ledger.push({t:'Покупка одноместной пристройки',d:-price,b:S.coins});}
  makeBookings();save();
  if(bedUp)toast('Номер стал двухместным, 50 за ночь. Объявление обновлено — едет первая пара.');
  else modal('<h2>Первый прототип пройден</h2><p>Две ночи позади, на выручку куплена пристройка. Теперь у тебя два номера на трёх человек.</p>'+
    '<p>Объявление обновлено: сегодня приедут пара и одиночный гость. Оплата и уборка считаются отдельно по каждому номеру.</p>',[{t:'Продолжить',pri:1}]);
}

function tasks(){
  const t=[],P=S.phase,R=S.rooms,add=(h,label,act)=>t.push(Object.assign({},h,{label,act}));
  if(P==='ad')add(HS.board,S.day===1?'Написать объявление':'Обновить объявление',adAct);
  if(P==='arrive'&&S.bookings.every(b=>b.stage==='door'))add(HS.guests,'Встретить и заселить',checkin);
  if(P==='dinner'){if(!S.cooked)add(HS.stove,'Приготовить ужин',cook);else if(!S.served)add(HS.table,'Подать ужин',serve);}
  if(P==='bed')for(const b of S.bookings)if(b.stage==='table')
    add(b.room==='home'?HS.hbed:HS.abed,b.room==='home'&&R.home.cap===1?'Застелить диван':'Застелить постель',()=>makeBed(b));
  if(P==='morning')for(const b of S.bookings){
    const home=b.room==='home',bed=R[b.room].bed,h=home?HS.hbed:HS.abed;
    if(!b.paid)add(home?HS.table:HS.astand,'Забрать оплату',()=>collect(b));
    else if(home&&S.dishes)add(HS.table,'Убрать посуду',washUp);
    if(bed==='used')add(h,'Снять бельё',()=>strip(b.room));
    else if(bed==='bare')add(h,'Подготовить номер',()=>prep(b.room));
  }
  if(P==='build'){if(R.home.cap===1)add(HS.hbed,'Второе спальное место',openBuild);else add(HS.adoor,'Построить пристройку',openBuild);}
  return t;
}
function hotspots(){
  const T=tasks(),here=T.filter(h=>h.scene===player.scene).map(h=>Object.assign(h,{mark:1}));
  const none=!here.length,need=s=>none&&T.some(h=>h.scene===s),away=none&&T.length>0;
  if(player.scene==='out'){
    here.push(Object.assign({},HS.hdoor,{label:'Войти в дом',mark:need('home'),act:()=>go('home',3.5,5.2)}));
    if(S.rooms.annex.built)here.push(Object.assign({},HS.adoor,{label:'Войти в пристройку',mark:need('annex'),act:()=>go('annex',2,3.2)}));
    if(S.phase!=='ad')here.push(Object.assign({},HS.board,{act:()=>toast(S.posted?'«'+S.adText+'» — объявление уже висит, второй раз звать некого.':'Доска для объявлений. Сначала подготовь номера.')}));
  }else if(player.scene==='home')here.push(Object.assign({},HS.hmat,{label:'Выйти',mark:away,act:()=>go('out',6.5,6.6)}));
  else here.push(Object.assign({},HS.amat,{label:'Выйти',mark:away,act:()=>go('out',11.25,6.6)}));
  return here;
}

// ---------- движение ----------
function step(e,dt){
  if(!e.path.length){e.walk=0;return;}
  const p=e.path[0];
  if(p.warp){e.scene=p.warp;e.x=p.x;e.y=p.y;e.path.shift();return;}
  if(p.lie){e.lying=true;e.path.shift();return;}
  if(p.gone){e.gone=true;e.path=[];return;}
  const s=SC[e.scene].speed*dt,dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy);
  if(d<=s){e.x=p.x;e.y=p.y;e.path.shift();}else{e.x+=dx/d*s;e.y+=dy/d*s;}
  e.walk+=dt;
}
function update(dt){
  if(player.busy){const b=player.busy;b.t+=dt;if(b.t>=b.d){player.busy=null;b.cb();}}
  else{step(player,dt);if(!player.path.length&&player.then){const f=player.then;player.then=null;f();}}
  for(const e of ents)step(e,dt);
  ents=ents.filter(e=>!e.gone);
  for(const b of S.bookings)if(b.stage==='coming'){
    const m=ents.filter(e=>e.b===b.id);
    if(m.length&&m.every(e=>!e.path.length)){b.stage='door';save();}
  }
  if(S.phase==='dinner'&&S.served){eatT-=dt;if(eatT<=0){S.dishes=true;S.phase='bed';toast('Гости поужинали. Пора стелить постель.');save();}}
  $('morningBtn').hidden=!(S.phase==='night'&&ents.every(e=>e.lying)&&!$('fade').classList.contains('on'));
}

// ---------- рисование ----------
function P(x,y,z){return[sc.ox+(x-y)*sc.tw/2,sc.oy+(x+y)*sc.th/2-(z||0)];}
function quad(p,c){g.fillStyle=c;g.beginPath();g.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)g.lineTo(p[i][0],p[i][1]);g.closePath();g.fill();}
function topq(x0,y0,x1,y1,z,c){quad([P(x0,y0,z),P(x1,y0,z),P(x1,y1,z),P(x0,y1,z)],c);}
function box(x,y,w,d,h,ct,cl,cr,z){z=z||0;
  quad([P(x,y+d,z+h),P(x+w,y+d,z+h),P(x+w,y+d,z),P(x,y+d,z)],cl);
  quad([P(x+w,y,z+h),P(x+w,y+d,z+h),P(x+w,y+d,z),P(x+w,y,z)],cr);
  topq(x,y,x+w,y+d,z+h,ct);
}
function fy(x0,x1,y,z0,z1,c){quad([P(x0,y,z0),P(x1,y,z0),P(x1,y,z1),P(x0,y,z1)],c);}
function fx(x,y0,y1,z0,z1,c){quad([P(x,y0,z0),P(x,y1,z0),P(x,y1,z1),P(x,y0,z1)],c);}
function coins(x,y,z){for(let i=0;i<3;i++){const p=P(x+i*.12,y-i*.05,z+i*2);g.fillStyle='#b8860b';g.fillRect(p[0]-3,p[1]-1,6,3);g.fillStyle='#ffd35a';g.fillRect(p[0]-3,p[1]-2,6,2);}}
const tod=()=>({ad:'day',arrive:'eve',dinner:'eve',bed:'eve',night:'night',morning:'morn',build:'morn'})[S.phase];
const SKY={day:'#a9dcf0',eve:'#f2b077',night:'#27325f',morn:'#cfeaf2'};
const lit=()=>['dinner','bed','night'].includes(S.phase);

function house(x,y,w,d,h,doorX){
  box(x,y,w,d,h,'#e8d2a6','#ecd3a2','#cfa873');
  fy(doorX-.35,doorX+.35,y+d,0,h*.62,'#7a4b2a');
  const p=P(doorX+.2,y+d,h*.3);g.fillStyle='#e9c46a';g.fillRect(p[0],p[1],2,2);
  const wc=lit()?'#ffe27a':'#8fc6da';
  fy(x+.45,x+1.25,y+d,h*.34,h*.7,wc);if(w>3)fy(x+w-1.25,x+w-.45,y+d,h*.34,h*.7,wc);
  fx(x+w,y+d*.3,y+d*.6,h*.34,h*.7,wc);
  const o=.3,rh=h*.7,e=[P(x-o,y-o,h),P(x+w+o,y-o,h),P(x+w+o,y+d+o,h),P(x-o,y+d+o,h)],r1=P(x+w*.3,y+d/2,h+rh),r2=P(x+w*.7,y+d/2,h+rh);
  quad([e[0],e[1],r2,r1],'#96462a');quad([e[0],e[3],r1],'#96462a');quad([e[1],e[2],r2],'#ad5633');quad([e[3],e[2],r2,r1],'#c96a40');
}
function tree(x,y){box(x+.35,y+.35,.3,.3,10,'#6b4a2b','#7a5632','#5f4126');box(x,y,1,1,12,'#5f9a48','#4f8a3c','#417733',8);box(x+.2,y+.2,.6,.6,8,'#73ad57','#5f9a48','#4f8a3c',20);}
function person(e,isP){
  const p=P(e.x,e.y),s=sc.tw/32,r=v=>Math.round(v*s),X=Math.round(p[0]),Y=Math.round(p[1]);
  const mv=e.path.length>0&&!e.busy,st=mv?Math.floor(e.walk*8)%2:0;
  g.fillStyle='rgba(0,0,0,.22)';g.beginPath();g.ellipse(X,Y,r(6),r(2.5),0,0,7);g.fill();
  g.fillStyle='#3b2f2a';g.fillRect(X-r(3),Y-r(4)-(mv&&st?r(1):0),r(2),r(4));g.fillRect(X+r(1),Y-r(4)-(mv&&!st?r(1):0),r(2),r(4));
  g.fillStyle=e.col;g.fillRect(X-r(4),Y-r(12),r(8),r(8));
  if(isP){g.fillStyle='#f3ead8';g.fillRect(X-r(2),Y-r(11),r(4),r(6));}
  g.fillStyle='#f0c8a0';g.fillRect(X-r(3),Y-r(18),r(6),r(6));
  g.fillStyle=e.hair;g.fillRect(X-r(3),Y-r(19),r(6),r(2));
  g.fillStyle='#2a2020';g.fillRect(X-r(2),Y-r(15),r(1),r(1));g.fillRect(X+r(1),Y-r(15),r(1),r(1));
  if(isP&&S.cooked&&!S.served){g.fillStyle='#fff';g.fillRect(X+r(3),Y-r(10),r(6),r(2));g.fillStyle='#c8743a';g.fillRect(X+r(4),Y-r(11),r(4),r(1));}
  if(isP&&e.busy){const w=r(18),k=e.busy.t/e.busy.d;g.fillStyle='#231a10';g.fillRect(X-w/2-1,Y-r(25)-1,w+2,5);g.fillStyle='#ffd35a';g.fillRect(X-w/2,Y-r(25),w*k,3);}
}
function people(list){
  for(const e of ents)if(e.scene===player.scene&&!e.lying)list.push({d:e.x+e.y,f:()=>person(e)});
  list.push({d:player.x+player.y,f:()=>person(player,1)});
  list.sort((a,b)=>a.d-b.d).forEach(o=>o.f());
}
function drawOut(){
  const an=S.rooms.annex.built;
  for(let y=0;y<12;y++)for(let x=0;x<14;x++){
    let c=(x+y)%2?'#7fae55':'#78a850';
    if(y===9||y===10)c=(x+y)%2?'#c9a36b':'#c39c63';
    else if(x===6&&y>=6&&y<9)c='#d2b07a';
    else if(an&&x===11&&y>=6&&y<9)c='#d2b07a';
    else if(x>=10&&x<13&&y>=3&&y<6)c='#a98a5e';
    else if(x<3&&y>=1&&y<5)c=(x+y)%2?'#9c8458':'#a48b5d';
    quad([P(x,y),P(x+1,y),P(x+1,y+1),P(x,y+1)],c);
  }
  tree(0,5.2);tree(3,0);tree(13,1);tree(9,.5);tree(13,3.4);
  house(4,2,5,4,34,6.5);
  if(an)house(10,3.5,2.5,2.5,28,11.25);
  else{
    g.strokeStyle='#f3e9d6';g.setLineDash([3,3]);g.beginPath();
    [[10,3.5],[12.5,3.5],[12.5,6],[10,6],[10,3.5]].forEach((q,i)=>{const p=P(q[0],q[1]);i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]);});
    g.stroke();g.setLineDash([]);
    box(11.2,5.9,.1,.1,12,'#8a6238','#8a6238','#6f4e2c');fy(10.9,11.6,6,8,16,'#e9d8a8');
  }
  const list=[{d:16.05,f:()=>{
    box(2.92,7.95,.16,.16,22,'#8a6238','#8a6238','#6f4e2c');
    fy(2.45,3.55,8.12,9,24,'#b08a5a');
    if(S.posted){fy(2.6,3.4,8.13,11,22,'#fbf3d8');g.fillStyle='#7a6650';for(let i=0;i<3;i++){const p=P(2.7,8.13,19-i*3);g.fillRect(p[0],p[1],9-i*2,1);}}
  }}];
  people(list);
}
function room(gw,gh,wx0,wx1){
  for(let y=0;y<gh;y++)for(let x=0;x<gw;x++)quad([P(x,y),P(x+1,y),P(x+1,y+1),P(x,y+1)],(x+y)%2?'#c79a62':'#bf9159');
  const wh=64;
  quad([P(0,0),P(0,gh),P(0,gh,wh),P(0,0,wh)],'#e2cfa8');quad([P(0,0),P(gw,0),P(gw,0,wh),P(0,0,wh)],'#f2e4c4');
  fy(wx0-.08,wx1+.08,0,24,56,'#8a6238');fy(wx0,wx1,0,27,53,SKY[tod()]);
  quad([P(0,0),P(gw,0),P(gw,0,5),P(0,0,5)],'#a9793f');quad([P(0,0),P(0,gh),P(0,gh,5),P(0,0,5)],'#96693a');
}
function mat(h){topq(h.x-.5,h.y-.25,h.x+.5,h.y+.4,0,'#7a5a3a');topq(h.x-.4,h.y-.15,h.x+.4,h.y+.3,0,'#94704a');}
function bed(x,y,w,d,ax,st,sl,sofa){
  if(sofa)box(x,y,w,.2,34,'#6f8ca6','#7c9bb5','#5f7b94');
  box(x,y+(sofa?.2:0),w,d-(sofa?.2:0),14,sofa?'#86a3bd':'#efe6d2',sofa?'#6f8ca6':'#9a6b42',sofa?'#5f7b94':'#85592f');
  if(!sofa)box(x,y,w,.1,26,'#9a6b42','#9a6b42','#85592f');
  const y0=y+(sofa?.25:.15),z=14.5;
  if(st==='made'||st==='used'){
    topq(x+.05,y0,x+w-.05,y+d-.05,z,st==='made'?'#fbf7ec':'#d6cfbf');
    if(ax)topq(x+.1,y0+.05,x+.5,y+d-.12,z+2,'#fff');else topq(x+.1,y0+.05,x+w-.1,y0+.4,z+2,'#fff');
    if(st==='made'){if(ax)topq(x+.65,y0,x+w-.05,y+d-.05,z+2,'#c9684a');else topq(x+.05,y0+.55,x+w-.05,y+d-.05,z+2,'#c9684a');}
    else{if(ax)topq(x+1,y0+.1,x+w-.2,y+d-.3,z+3,'#b85f45');else topq(x+.2,y0+.9,x+w-.25,y+d-.3,z+3,'#b85f45');}
  }
  if(sl){const hx=ax?x+.3:x+w/2,hy=ax?(y0+y+d)/2:y0+.22;box(hx-.13,hy-.13,.26,.26,5,sl.hair,'#f0c8a0','#e0b890',z+2);}
}
function drawHome(){
  room(7,6,3,4.2);
  topq(4.55,.15,6.95,2.9,0,'#a85a44');topq(4.7,.3,6.8,2.75,0,'#bb6b50');
  mat(HS.hmat);
  const sl=ents.filter(e=>e.scene==='home'&&e.lying),R=S.rooms.home,list=[];
  list.push({d:1,f:()=>{
    box(.15,.15,.8,.85,26,'#b98452','#a9743f','#946335');
    if(!S.cooked&&S.phase!=='morning'&&S.phase!=='build'){const p=P(.55,.55,27);g.fillStyle='#d94f3a';g.fillRect(p[0]-6,p[1]-4,4,4);g.fillStyle='#6fae4a';g.fillRect(p[0],p[1]-5,5,5);g.fillStyle='#e9c46a';g.fillRect(p[0]-2,p[1]-1,4,3);}
  }});
  list.push({d:2.1,f:()=>{
    box(1,.15,1,.85,28,'#55555d','#8f9096','#7c7d84');
    const a=P(1.3,.5,28),b=P(1.7,.65,28);g.fillStyle='#26262b';g.fillRect(a[0]-4,a[1]-2,8,4);g.fillRect(b[0]-4,b[1]-2,8,4);
    fy(1.15,1.85,1,6,20,'#3a3a40');
    if(player.busy&&player.busy.k==='cook'){const t=player.busy.t;g.fillStyle='#ff9a3a';g.fillRect(a[0]-3,a[1]-4,6,2);g.fillStyle='rgba(255,255,255,.7)';for(let i=0;i<3;i++)g.fillRect(a[0]-4+i*4,a[1]-8-((t*18+i*5)%14),2,3);}
  }});
  list.push({d:6.35,f:()=>{
    for(const q of[[2.55,2.65],[3.83,2.65],[2.55,3.43],[3.83,3.43]])box(q[0],q[1],.12,.12,20,'#8a5f33','#8a5f33','#74502b');
    box(2.5,2.6,1.5,1,4,'#c99562','#a9743f','#946335',20);
    if(S.served||S.dishes)for(const k of S.plates){const p=P(PLATES[k].x,PLATES[k].y,24);g.fillStyle=S.dishes?'#d9d4c8':'#fff';g.beginPath();g.ellipse(p[0],p[1],6,3,0,0,7);g.fill();g.fillStyle=S.dishes?'#8f7f66':'#c8743a';g.fillRect(p[0]-2,p[1]-2,S.dishes?2:5,2);}
    const b=S.bookings.find(b=>b.room==='home');if(S.phase==='morning'&&b&&!b.paid)coins(3.2,3.4,25);
  }});
  if(R.cap===1)list.push({d:6.6,f:()=>bed(4.95,.25,1.8,1,1,R.bed,sl[0],1)});
  else{list.push({d:6.4,f:()=>bed(4.9,.25,.85,1.8,0,R.bed,sl[0])});list.push({d:7.5,f:()=>bed(5.95,.25,.85,1.8,0,R.bed,sl[1])});}
  people(list);
}
function drawAnnex(){
  room(4,4,1.6,2.5);mat(HS.amat);
  const sl=ents.filter(e=>e.scene==='annex'&&e.lying),list=[];
  list.push({d:1.9,f:()=>bed(.3,.25,.9,1.9,0,S.rooms.annex.bed,sl[0])});
  list.push({d:3.6,f:()=>{box(2.8,.2,.6,.6,20,'#b98452','#a9743f','#946335');const b=S.bookings.find(b=>b.room==='annex');if(S.phase==='morning'&&b&&!b.paid)coins(3,.5,21);}});
  people(list);
}
const TINT={day:[255,230,170,0],eve:[255,140,60,.14],night:[18,26,84,.5],morn:[255,240,190,.06]};
let tint=[255,230,170,0],labs=[];
function draw(t){
  g.fillStyle=player.scene==='out'?'#31452c':'#241d18';g.fillRect(0,0,W,H);
  if(player.scene==='out')drawOut();else if(player.scene==='home')drawHome();else drawAnnex();
  const T=TINT[tod()];for(let i=0;i<4;i++)tint[i]+=(T[i]-tint[i])*.06;
  const a=tint[3]*(player.scene==='out'?1:.6);
  if(a>.005){g.fillStyle='rgba('+(tint[0]|0)+','+(tint[1]|0)+','+(tint[2]|0)+','+a+')';g.fillRect(0,0,W,H);}
  const hs=player.busy?[]:hotspots().filter(h=>h.mark),box=$('labels');
  while(labs.length<hs.length){const d=document.createElement('div');d.className='lab';box.appendChild(d);labs.push(d);}
  labs.forEach((d,i)=>{
    const h=hs[i];if(!h){d.hidden=true;return;}
    const p=P(h.x,h.y,h.z),by=Math.round(Math.sin(t/220+i)*2),X=Math.round(p[0]),Y=Math.round(p[1])+by;
    g.fillStyle='#231a10';g.beginPath();g.moveTo(X-6,Y-9);g.lineTo(X+6,Y-9);g.lineTo(X,Y+1);g.fill();
    g.fillStyle='#ffd35a';g.beginPath();g.moveTo(X-4,Y-8);g.lineTo(X+4,Y-8);g.lineTo(X,Y-1);g.fill();
    d.hidden=false;if(d.textContent!==h.label)d.textContent=h.label;
    d.style.left=(p[0]/W*100)+'%';d.style.top=((p[1]-13)/H*100)+'%';
  });
}

// ---------- ввод ----------
cv.addEventListener('pointerdown',ev=>{
  if(player.busy||$('fade').classList.contains('on'))return;
  const r=cv.getBoundingClientRect(),mx=(ev.clientX-r.left)/r.width*W,my=(ev.clientY-r.top)/r.height*H;
  let best=null,bd=24*sc.tw/32;
  for(const h of hotspots()){const p=P(h.x,h.y,h.z*.5),d=Math.hypot(p[0]-mx,p[1]-my)-(h.mark?6:0);if(d<bd){bd=d;best=h;}}
  if(best){player.path=[{x:best.ax,y:best.ay}];player.then=best.act;return;}
  const a=(mx-sc.ox)/(sc.tw/2),b=(my-sc.oy)/(sc.th/2);
  const cl=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
  player.path=[{x:cl((a+b)/2,sc.minx,sc.maxx),y:cl((b-a)/2,sc.miny,sc.maxy)}];player.then=null;
});
$('morningBtn').onclick=toMorning;
$('newBtn').onclick=()=>modal('<h2>Начать заново?</h2><p>Текущий прогресс будет стёрт.</p>',[{t:'Отмена'},{t:'Новая игра',pri:1,fn:()=>{start(null);intro();}}]);

// ---------- интерфейс ----------
function modal(html,btns){
  const box=$('box');box.innerHTML=html+'<div class="btns"></div>';
  for(const b of btns){const el=document.createElement('button');el.textContent=b.t;if(b.pri)el.className='pri';el.disabled=!!b.off;
    el.onclick=()=>{$('modal').hidden=true;if(b.fn)b.fn();};box.lastChild.appendChild(el);}
  $('modal').hidden=false;
}
let toastT=0;
function toast(s){$('toast').innerHTML='';const sp=document.createElement('span');sp.textContent=s;$('toast').appendChild(sp);clearTimeout(toastT);toastT=setTimeout(()=>$('toast').innerHTML='',5200);}
function goalText(){
  const P=S.phase,R=S.rooms;
  if(P==='ad')return S.day===1?'Напиши объявление и повесь его у дороги.':'Обнови объявление у дороги, чтобы позвать гостей.';
  if(P==='arrive')return S.bookings.every(b=>b.stage==='door')?'Гости у двери — встреть и засели их.':'Отклик есть: гости идут по дороге. Встреть их у двери дома.';
  if(P==='dinner')return!S.cooked?'Приготовь ужин на плите. Продуктов хватит ровно на '+gn()+' '+(gn()===1?'порцию':'порции')+'.':!S.served?'Поставь ужин на стол.':'Гости ужинают…';
  if(P==='bed')return'Застели постель в каждом занятом номере.';
  if(P==='night')return'Все спят. Можно перейти к утру.';
  if(P==='morning')return'Забери оплату и убери каждый номер: посуда, бельё, подготовка.';
  return R.home.cap===1?'Уборка закончена. Добавь в номер второе спальное место.':'Уборка закончена. Построй пристройку рядом с домом.';
}
function hud(){
  if(!S)return;const R=S.rooms;
  $('coins').textContent=S.coins;
  $('time').textContent='День '+(S.day+(S.phase==='morning'?1:0))+' · '+({day:'День',eve:'Вечер',night:'Ночь',morn:'Утро'})[tod()];
  const big=R.home.cap===1?'Большая цель: заработать на второе спальное место.':!R.annex.built?'Большая цель: заработать на одноместную пристройку.':'Два номера на трёх человек. Дальше — свободная игра.';
  $('goal').innerHTML='';const a=document.createElement('div');a.textContent=goalText();const b=document.createElement('small');b.textContent=big;$('goal').append(a,b);
  const bedT={ready:'убран',made:'постель застелена',used:'нужна уборка',bare:'бельё снято'};
  $('rooms').innerHTML=['home','annex'].map(id=>{
    const r=R[id],bk=S.bookings.find(b=>b.room===id&&b.stage!=='left');
    if(!r.built)return'<div class="room off"><h3>Пристройка</h3>Земля под застройку · '+PRICE.annex+' монет</div>';
    return'<div class="room"><h3>'+(id==='home'?'Номер в доме':'Пристройка')+'</h3>Мест: '+r.cap+' · '+r.rate+' монет за ночь<br>'+
      (bk?(bk.n===2?'Забронирован парой':'Забронирован гостем'):'Свободен')+' · '+bedT[r.bed]+(id==='home'&&S.dishes?' · грязная посуда':'')+'</div>';
  }).join('');
  $('ledger').innerHTML='<tr><th>Момент</th><th class="n">Доход / расход</th><th class="n">Остаток</th></tr>'+
    S.ledger.map(l=>'<tr><td>'+l.t+'</td><td class="n">'+(l.d>0?'+'+l.d:l.d<0?'−'+(-l.d):'—')+'</td><td class="n">'+l.b+'</td></tr>').join('');
}
function intro(){toast('Это твой дом. Кликни по доске у дороги, чтобы позвать первого гостя.');}

// ---------- запуск ----------
const saved=load();start(saved);if(!saved)intro();
let last=performance.now();
function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);draw(t);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
window.__game={get S(){return S;},get player(){return player;},get ents(){return ents;},hotspots,update};
</script>
